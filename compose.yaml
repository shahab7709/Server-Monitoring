name: server-monitoring
x-db-env: &db-env
  DATABASE_URL: postgres://monitor:monitor@db:5432/monitor?sslmode=disable
  NATS_URL: nats://nats:4222
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 3s
      retries: 30
  nats:
    image: nats:2.10-alpine
    command: ["-js","-sd","/data","-m","8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "/nats-server", "--help"]
      interval: 10s
  api:
    restart: unless-stopped
    # build: {context: ., args: {TARGET: api}}
    build:
      context: .
      dockerfile: Dockerfile
      target: ""
      network: host
      args:
        TARGET: api
        HTTP_PROXY: socks5h://127.0.0.1:12334
        HTTPS_PROXY: socks5h://127.0.0.1:12334
        ALL_PROXY: socks5h://127.0.0.1:12334
    environment: *db-env
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_started}
    healthcheck:
      test: ["CMD", "/app", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
  worker:
    restart: unless-stopped
    build: 
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        TARGET: worker
        HTTP_PROXY: socks5h://127.0.0.1:12334
        HTTPS_PROXY: socks5h://127.0.0.1:12334
        ALL_PROXY: socks5h://127.0.0.1:12334    
    environment: *db-env
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_started}
  simulator:
    restart: unless-stopped
    build:
      context: .
      network: host
      args:
        TARGET: simulator
        HTTP_PROXY: socks5h://127.0.0.1:12334
        HTTPS_PROXY: socks5h://127.0.0.1:12334
        ALL_PROXY: socks5h://127.0.0.1:12334    
    environment:
      API_URL: http://api:8080
      DEVICE_COUNT: ${DEVICE_COUNT:-2}
      HISTORY_DAYS: ${HISTORY_DAYS:-3}
      SEED: ${SEED:-42}
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}
  smoke:
    profiles: ["test"]
    build: 
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        TARGET: smoke
        HTTP_PROXY: socks5h://127.0.0.1:12334
        HTTPS_PROXY: socks5h://127.0.0.1:12334
        ALL_PROXY: socks5h://127.0.0.1:12334       
    environment: {API_URL: "http://api:8080"}
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}
volumes:
  pgdata:
  natsdata:
