<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پایش سرورها</title><style>
:root{font-family:system-ui,sans-serif;background:#0d1523;color:#e8f0ff}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1300px;margin:auto}h1{margin-top:0}.panel{background:#172337;border:1px solid #34465c;padding:20px;border-radius:14px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}label{display:block;color:#b7c8dd;margin-bottom:8px}input,button{border-radius:8px;border:1px solid #405773;background:#0d1828;color:white;padding:10px;font:inherit}input:not([type=checkbox]){width:100%}button{cursor:pointer;background:#235d9f}button:hover{background:#367dc5}.device{display:block;width:100%;margin:4px 0;text-align:right;background:#26405d}.device.active,.ranges .active{background:#208a82}.search-results{max-height:170px;overflow:auto}.sensors,.ranges,.actions,.legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.sensors label{display:flex;gap:5px;align-items:center}.actions>*{flex:1;min-width:160px}.actions button{flex:0 0 auto;align-self:end}canvas{width:100%;height:430px;direction:ltr;display:block}.status{color:#9eb2c8}.error{padding:12px;color:#ffb3ac}small{color:#96aac1}@media(max-width:750px){body{padding:10px}.grid{grid-template-columns:1fr}canvas{height:300px}}
</style></head><body><main><h1>📈 پایش سرورها</h1><section class="panel"><div class="grid"><div><label for="search">جستجوی نام یا شناسه دستگاه</label><input id="search" placeholder="server-00000"><div id="devices" class="search-results"></div></div><div><label>بازه زمانی آماده</label><div id="presets" class="ranges"></div></div><div><label>دستگاه انتخاب‌شده</label><strong id="selected">دستگاهی انتخاب نشده</strong></div></div><label>سنسورها (چندانتخابی)</label><div id="sensors" class="sensors"></div><div class="actions"><div><label for="from">از</label><input type="datetime-local" id="from"></div><div><label for="to">تا</label><input type="datetime-local" id="to"></div><button id="load">نمایش نمودار</button><button id="refresh">تازه‌سازی ↻</button></div></section><section class="panel"><h2>نمودار سنسورها · محور مشترک ۰ تا ۱۰۰٪</h2><div id="status" class="status" role="status">آماده</div><div id="legend" class="legend"></div><canvas id="chart" role="img" aria-label="نمودار زمان‌مند سنسورها"></canvas><div id="error" class="error" hidden></div><small>خط نشانگر میانگین و خطوط عمودی کم‌رنگ دامنه کمینه/بیشینه هستند؛ داده گمشده صفر نیست.</small></section></main><script>
'use strict';
const labels={cpu:'پردازنده',memory:'حافظه',disk_space:'فضای دیسک',disk_busy:'مشغولیت دیسک',net_in:'شبکه ورودی',net_out:'شبکه خروجی',fan:'سرعت فن'},keys=Object.keys(labels),colors=['#59b9ff','#ffb76f','#be9bff','#8ee0a7','#fb7e92','#ead675','#58dadd'];
const el=id=>document.getElementById(id);let device=null,rangeMs=300000,controller=null,searchController=null,chart=null;
keys.forEach((key,i)=>{let label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=key;input.checked=i<3;label.append(input,document.createTextNode(labels[key]));el('sensors').append(label)});
[['۵ دقیقه',300000],['۱ ساعت',3600000],['۶ ساعت',21600000],['۱ روز',86400000],['۷ روز',604800000],['۳۰ روز',2592000000],['۱ سال',31536000000]].forEach(([text,ms],i)=>{let btn=document.createElement('button');btn.textContent=text;btn.className=i===0?'active':'';btn.onclick=()=>{rangeMs=ms;setDates();document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('active',b===btn));load()};el('presets').append(btn)});
function local(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}function setDates(){let t=new Date();el('from').value=local(new Date(t-rangeMs));el('to').value=local(t)}function err(v){el('error').textContent=v;el('error').hidden=!v}
async function devices(){searchController?.abort();searchController=new AbortController();try{let r=await fetch('/api/v1/devices?'+new URLSearchParams({search:el('search').value,limit:'25'}),{signal:searchController.signal});if(!r.ok)throw Error('خطای جستجو');let data=await r.json();el('devices').replaceChildren();data.devices.forEach(d=>{let b=document.createElement('button');b.className='device'+(d.id===device?' active':'');b.textContent=d.name+' · '+d.id;b.onclick=()=>{device=d.id;el('selected').textContent=d.name;devices();load()};el('devices').append(b)});if(!data.devices.length)el('devices').textContent='نتیجه‌ای یافت نشد'}catch(e){if(e.name!=='AbortError')el('devices').textContent=e.message}}
let timer;el('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(devices,200)};el('load').onclick=load;el('refresh').onclick=()=>{setDates();load()};
async function load(){if(!device){el('status').textContent='دستگاهی را انتخاب کنید';return}let selected=[...document.querySelectorAll('#sensors input:checked')].map(x=>x.value);if(!selected.length){err('حداقل یک سنسور انتخاب کنید');return}let from=new Date(el('from').value),to=new Date(el('to').value);if(!(from<to)||to-from>365*86400000){err('بازه باید مثبت و حداکثر یک سال باشد');return}controller?.abort();controller=new AbortController();let own=controller;err('');el('status').textContent='در حال بارگذاری...';let start=performance.now();try{let params=new URLSearchParams({device_id:device,metrics:selected.join(','),from:from.toISOString(),to:to.toISOString(),max_points:'1500'});let r=await fetch('/api/v1/metrics/query?'+params,{signal:own.signal});let data=await r.json();if(!r.ok)throw Error(data.error?.message||'خطای دریافت داده');if(own!==controller)return;chart={data,selected};render();el('status').textContent=`${data.points.length} بازه | ${data.resolution} | ${Math.round(performance.now()-start)} میلی‌ثانیه`;if(!data.points.some(p=>p.metrics))err('در این بازه داده‌ای وجود ندارد')}catch(e){if(e.name!=='AbortError'){err(e.message);el('status').textContent='خطا'}}}
function render(){if(!chart)return;let {data,selected}=chart,cv=el('chart'),width=cv.clientWidth,height=cv.clientHeight,dpr=window.devicePixelRatio||1;cv.width=Math.round(width*dpr);cv.height=Math.round(height*dpr);let c=cv.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,width,height);let l=46,r=15,t=15,b=48,W=width-l-r,H=height-t-b,x=i=>l+i*W/Math.max(1,data.points.length-1),y=v=>t+(100-v)*H/100;c.font='12px system-ui';for(let v=0;v<=100;v+=20){c.strokeStyle='#34425a';c.beginPath();c.moveTo(l,y(v));c.lineTo(width-r,y(v));c.stroke();c.fillStyle='#a7b9cd';c.textAlign='right';c.fillText(v+'%',l-5,y(v)+4)}for(let j=0;j<=5;j++){let i=Math.floor(j*Math.max(0,data.points.length-1)/5);if(!data.points.length)break;c.fillStyle='#a7b9cd';c.textAlign='center';c.fillText(new Date(data.points[i].time).toLocaleString('fa-IR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),x(i),height-12)}el('legend').replaceChildren();selected.forEach(m=>{let color=colors[keys.indexOf(m)],label=document.createElement('span');label.style.color=color;label.textContent='● '+labels[m];el('legend').append(label);c.strokeStyle=color;c.lineWidth=1.8;c.beginPath();let prev=false;data.points.forEach((p,i)=>{let v=p.metrics?.[m];if(!v){prev=false;return}if(prev)c.lineTo(x(i),y(v.avg));else c.moveTo(x(i),y(v.avg));prev=true});c.stroke();c.globalAlpha=.20;c.lineWidth=1;data.points.forEach((p,i)=>{let v=p.metrics?.[m];if(!v)return;c.beginPath();c.moveTo(x(i),y(v.min));c.lineTo(x(i),y(v.max));c.stroke()});c.globalAlpha=1})}
window.addEventListener('resize',render);setDates();devices();setInterval(()=>{if(device&&rangeMs===300000){setDates();load()}},30000);
</script></body></html>
